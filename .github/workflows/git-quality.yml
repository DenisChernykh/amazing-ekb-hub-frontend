name: git-quality

on:
  pull_request:
    branches:
      - stage
      - main

concurrency:
  group: git-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm run format:check

      - name: Check branch name
        run: bash ./scripts/git/check-branch-name.sh "${{ github.head_ref }}"

      - name: Enforce PR flow for stage
        if: ${{ github.base_ref == 'stage' }}
        run: |
          if [[ ! "${{ github.head_ref }}" =~ ^[a-z0-9._-]+/[a-z0-9._-]+$ ]]; then
            echo "ERROR: PRs to stage must come from <type>/<short-name>."
            echo "Current head branch: ${{ github.head_ref }}"
            exit 1
          fi

      - name: Enforce PR flow for main
        if: ${{ github.base_ref == 'main' }}
        run: |
          if [[ "${{ github.head_ref }}" != "stage" ]]; then
            echo "ERROR: PRs to main must come only from stage."
            echo "Current head branch: ${{ github.head_ref }}"
            exit 1
          fi

      - name: Check commit messages
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Run lint
        run: pnpm run lint:strict

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Validate build environment
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "::error::API_BASE_URL repository variable is required."
            exit 1
          fi

      - name: Run build
        run: pnpm run build
