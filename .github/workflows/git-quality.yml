name: git-quality

on:
  pull_request:
    branches:
      - stage
      - main

concurrency:
  group: git-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: http://127.0.0.1:3000
      PUBLIC_BASE_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm run format:check

      - name: Check branch name
        run: bash ./scripts/git/check-branch-name.sh "${{ github.head_ref }}"

      - name: Enforce PR flow for stage
        if: ${{ github.base_ref == 'stage' }}
        run: |
          if [[ ! "${{ github.head_ref }}" =~ ^[a-z0-9._-]+/[a-z0-9._-]+$ ]]; then
            echo "ERROR: PRs to stage must come from <type>/<short-name>."
            echo "Current head branch: ${{ github.head_ref }}"
            exit 1
          fi

      - name: Enforce PR flow for main
        if: ${{ github.base_ref == 'main' }}
        run: |
          if [[ "${{ github.head_ref }}" != "stage" ]]; then
            echo "ERROR: PRs to main must come only from stage."
            echo "Current head branch: ${{ github.head_ref }}"
            exit 1
          fi

      - name: Check commit messages
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Run lint
        run: pnpm run lint:strict

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run build with local catalog fixture
        run: |
          node ./scripts/ci/catalog-build-fixture-server.mjs >"${RUNNER_TEMP}/catalog-build-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "${fixture_pid}" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/__ci/ready >/dev/null; then
              pnpm run build
              exit 0
            fi
            sleep 1
          done

          cat "${RUNNER_TEMP}/catalog-build-fixture.log"
          exit 1
