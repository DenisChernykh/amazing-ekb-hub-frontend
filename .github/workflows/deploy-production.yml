name: deploy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-frontend
  cancel-in-progress: false

jobs:
  quality:
    name: Verify frontend before production deploy
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || vars.PUBLIC_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint:strict

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Validate build environment
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "::error::API_BASE_URL repository variable is required."
            exit 1
          fi

          if [ -z "${PUBLIC_BASE_URL}" ]; then
            echo "::error::PUBLIC_BASE_URL production secret or variable is required."
            exit 1
          fi

      - name: Run build
        run: pnpm run build

  build-image:
    name: Build frontend runtime image
    needs: quality
    runs-on: ubuntu-latest
    environment: production

    env:
      IMAGE_NAME: amazing-ekb-hub-frontend
      IMAGE_ARTIFACT_NAME: frontend-runtime-image-${{ github.run_id }}-${{ github.sha }}
      IMAGE_ARTIFACT_PATH: frontend-runtime-image.tar.gz
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || vars.PUBLIC_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate production build environment
        run: |
          set -euo pipefail

          test -n "${API_BASE_URL}"
          test -n "${PUBLIC_BASE_URL}"

      - name: Build runtime image
        run: |
          docker build \
            --build-arg API_BASE_URL="${API_BASE_URL}" \
            --build-arg PUBLIC_BASE_URL="${PUBLIC_BASE_URL}" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:prod" \
            .

      - name: Export runtime image
        run: |
          set -euo pipefail

          docker save "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:prod" \
            | gzip -1 > "${IMAGE_ARTIFACT_PATH}"

      - name: Upload runtime image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: ${{ env.IMAGE_ARTIFACT_PATH }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  deploy:
    name: Deploy frontend to production
    needs: build-image
    runs-on:
      - self-hosted
      - Linux
      - X64
      - production
      - amazing-ekb-hub
      - frontend

    environment: production

    env:
      APP_DIR: /opt/amazing-ekb-hub
      IMAGE_NAME: amazing-ekb-hub-frontend
      IMAGE_ARTIFACT_NAME: frontend-runtime-image-${{ github.run_id }}-${{ github.sha }}
      IMAGE_ARTIFACT_DIR: /tmp/amazing-ekb-hub-frontend-${{ github.sha }}
      IMAGE_ARTIFACT_PATH: /tmp/amazing-ekb-hub-frontend-${{ github.sha }}/frontend-runtime-image.tar.gz
      FRONTEND_COMPOSE_OVERRIDE_PATH: /tmp/amazing-ekb-hub-frontend-${{ github.sha }}/frontend-secret.override.yml
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || vars.PUBLIC_BASE_URL }}
      CACHE_REVALIDATION_SECRET: ${{ secrets.CACHE_REVALIDATION_SECRET }}

    steps:
      - name: Download runtime image
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: ${{ env.IMAGE_ARTIFACT_DIR }}

      - name: Resolve production public base URL
        run: |
          set -euo pipefail

          public_base_url="${PUBLIC_BASE_URL}"

          if [ -z "${public_base_url}" ] && [ -f "${APP_DIR}/.env" ]; then
            public_base_url="$(
              awk -F= '
                $1 == "PUBLIC_BASE_URL" { value = substr($0, index($0, "=") + 1) }
                END { print value }
              ' "${APP_DIR}/.env"
            )"
          fi

          if [ -z "${public_base_url}" ] && [ -f "${APP_DIR}/.env" ]; then
            public_frontend_domain="$(
              awk -F= '
                $1 == "PUBLIC_FRONTEND_DOMAIN" { value = substr($0, index($0, "=") + 1) }
                END { print value }
              ' "${APP_DIR}/.env"
            )"

            if [ -n "${public_frontend_domain}" ]; then
              public_base_url="https://${public_frontend_domain}"
            fi
          fi

          public_base_url="${public_base_url%/}"

          test -n "${public_base_url}"
          printf 'PUBLIC_BASE_URL=%s\n' "${public_base_url}" >> "${GITHUB_ENV}"

      - name: Validate production environment
        run: |
          set -euo pipefail

          test -f "${IMAGE_ARTIFACT_PATH}"
          test -n "${PUBLIC_BASE_URL}"
          test -n "${CACHE_REVALIDATION_SECRET}"

          if [ "${#CACHE_REVALIDATION_SECRET}" -lt 32 ]; then
            echo "::error::CACHE_REVALIDATION_SECRET must contain at least 32 characters."
            exit 1
          fi

      - name: Prepare frontend runtime environment
        run: |
          set -euo pipefail

          cat > "${FRONTEND_COMPOSE_OVERRIDE_PATH}" <<'COMPOSE'
          services:
            frontend:
              environment:
                PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
                CACHE_REVALIDATION_SECRET: ${CACHE_REVALIDATION_SECRET:?CACHE_REVALIDATION_SECRET is required}
          COMPOSE
          chmod 600 "${FRONTEND_COMPOSE_OVERRIDE_PATH}"

      - name: Load runtime image
        run: |
          set -euo pipefail

          gzip -dc "${IMAGE_ARTIFACT_PATH}" | docker load

      - name: Deploy frontend
        run: |
          set -euo pipefail

          flock "${APP_DIR}/deploy.lock" bash <<'DEPLOY'
          set -euo pipefail

          cd "${APP_DIR}"
          docker compose --env-file .env -f compose.yml \
            -f "${FRONTEND_COMPOSE_OVERRIDE_PATH}" --profile apps up -d frontend
          docker compose --env-file .env -f compose.yml \
            -f "${FRONTEND_COMPOSE_OVERRIDE_PATH}" ps frontend
          DEPLOY

      - name: Cleanup runtime image artifact
        if: always()
        run: rm -rf "${IMAGE_ARTIFACT_DIR}"

      - name: Smoke test frontend
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl -fsS "${PUBLIC_BASE_URL}/" >/dev/null; then
              exit 0
            fi

            if [ "${attempt}" -eq 30 ]; then
              exit 1
            fi

            sleep 2
          done

      - name: Smoke test frontend API proxy
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl -fsS "${PUBLIC_BASE_URL}/v1/health/live" >/dev/null; then
              exit 0
            fi

            if [ "${attempt}" -eq 30 ]; then
              exit 1
            fi

            sleep 2
          done

      - name: Show frontend logs on failure
        if: failure()
        run: |
          docker compose --env-file /opt/amazing-ekb-hub/.env \
            -f /opt/amazing-ekb-hub/compose.yml \
            logs --tail=150 frontend || true
