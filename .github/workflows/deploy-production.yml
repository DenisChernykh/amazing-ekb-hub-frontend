name: deploy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-frontend
  cancel-in-progress: false

jobs:
  quality:
    name: Verify frontend before production deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint:strict

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run build
        run: pnpm run build

  deploy:
    name: Deploy frontend to production
    needs: quality
    runs-on:
      - self-hosted
      - Linux
      - X64
      - production
      - amazing-ekb-hub
      - frontend

    environment: production

    env:
      APP_DIR: /opt/amazing-ekb-hub
      IMAGE_NAME: amazing-ekb-hub-frontend
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.strelchukgo.ru/v1' }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://www.strelchukgo.ru' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate production environment
        run: |
          set -euo pipefail

          test -n "${API_BASE_URL}"
          test -n "${PUBLIC_BASE_URL}"

      - name: Build runtime image
        run: |
          docker build \
            --build-arg API_BASE_URL="${API_BASE_URL}" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:prod" \
            .

      - name: Deploy frontend
        run: |
          set -euo pipefail

          flock "${APP_DIR}/deploy.lock" bash <<'DEPLOY'
          set -euo pipefail

          cd "${APP_DIR}"
          docker compose --env-file .env -f compose.yml --profile apps up -d frontend
          docker compose --env-file .env -f compose.yml ps frontend
          DEPLOY

      - name: Smoke test frontend
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl -fsS "${PUBLIC_BASE_URL}/" >/dev/null; then
              exit 0
            fi

            if [ "${attempt}" -eq 30 ]; then
              exit 1
            fi

            sleep 2
          done

      - name: Show frontend logs on failure
        if: failure()
        run: |
          docker compose --env-file /opt/amazing-ekb-hub/.env \
            -f /opt/amazing-ekb-hub/compose.yml \
            logs --tail=150 frontend || true
