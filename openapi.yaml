# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2021-09-28
openapi: 3.0.3
info:
  title: Amazing EKB Hub API
  version: 1.0.0
  description: MVP backend API (OpenAPI-first)
servers:
  - url: /v1
tags:
  - name: Auth
    description: Аутентификация пользователя, refresh токенов и получение текущего профиля.
  - name: Places
    description: Публичные эндпоинты каталога мест и связанных с ними материалов.
  - name: Favorites
    description: Работа с избранными местами текущего пользователя.
  - name: Admin
    description: Административные операции управления местами и материалами.
  - name: Health
    description: Служебные эндпоинты liveness/readiness для мониторинга и orchestration.

components:
  securitySchemes:
    AccessCookieAuth:
      type: apiKey
      in: cookie
      name: aeh_access_token
      description: |
        HttpOnly cookie с JWT access token. Клиент должен отправлять запросы с credentials.
    RefreshCookieAuth:
      type: apiKey
      in: cookie
      name: aeh_refresh_token
      description: |
        HttpOnly cookie с refresh token для `/auth/refresh` и `/auth/logout`.

  parameters:
    PlaceId:
      name: placeId
      in: path
      required: true
      description: Идентификатор места.
      schema:
        type: string
      example: place_ekb_001

    MaterialId:
      name: materialId
      in: path
      required: true
      description: Идентификатор материала.
      schema:
        type: string
      example: material_telegram_001

    Page:
      name: page
      in: query
      required: false
      description: Номер страницы пагинации. Допустимый диапазон от `1` до `1000`.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
      example: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      description: Размер страницы. Допустимый диапазон от `1` до `100`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  examples:
    AuthLoginRequest:
      summary: Вход по email и паролю
      value:
        email: admin@amazing-ekb.ru
        password: supersecret123

    AuthMeResponse:
      summary: Профиль текущего пользователя
      value:
        id: user_admin_001
        email: admin@amazing-ekb.ru
        role: admin

    PlaceSummary:
      summary: Краткая карточка места
      value:
        id: place_ekb_001
        title: Bаден-Баден Уктус
        summary: Термальный комплекс с открытыми бассейнами и SPA-зоной.
        tags:
          - термы
          - spa
          - бассейн
        category: spa
        status: active
        popularityWeight: 95
        coverImageUrl: /v1/places/place_ekb_001/photo

    PublicPlaceSummary:
      summary: Краткая публичная карточка места
      value:
        id: place_ekb_001
        title: Bаден-Баден Уктус
        summary: Термальный комплекс с открытыми бассейнами и SPA-зоной.
        tags:
          - термы
          - spa
          - бассейн
        category: spa
        status: active
        popularityWeight: 95
        coverImageUrl: /v1/places/place_ekb_001/photo
        counters:
          dzen: 12
          telegram: 7
          instagram: 3

    PlaceDetail:
      summary: Детальная карточка места
      value:
        id: place_ekb_001
        title: Bаден-Баден Уктус
        summary: Термальный комплекс с открытыми бассейнами и SPA-зоной.
        tags:
          - термы
          - spa
          - бассейн
        category: spa
        status: active
        popularityWeight: 95
        coverImageUrl: /v1/places/place_ekb_001/photo
        pinnedMaterial:
          id: material_telegram_001
          placeId: place_ekb_001
          platform: telegram
          type: post
          title: Обзор комплекса и советы по посещению
          publishedAt: '2026-03-20T10:30:00.000Z'
          durationSec: null
          url: https://t.me/amazing_ekb/321
          redirectUrl: /v1/materials/material_telegram_001/go
        counters:
          dzen: 12
          telegram: 7
          instagram: 3

    PlaceListResponse:
      summary: Пагинированный список мест
      value:
        items:
          - id: place_ekb_001
            title: Bаден-Баден Уктус
            summary: Термальный комплекс с открытыми бассейнами и SPA-зоной.
            tags:
              - термы
              - spa
            category: spa
            status: active
            popularityWeight: 95
            coverImageUrl: /v1/places/place_ekb_001/photo
          - id: place_ekb_002
            title: The Pool
            summary: Современный бассейн с дорожками и семейной зоной.
            tags:
              - бассейн
              - family
            category: pools
            status: active
            popularityWeight: 74
            coverImageUrl: null
        total: 2
        page: 1
        pageSize: 20

    PublicPlaceListResponse:
      summary: Публичный пагинированный список мест
      value:
        items:
          - id: place_ekb_001
            title: Bаден-Баден Уктус
            summary: Термальный комплекс с открытыми бассейнами и SPA-зоной.
            tags:
              - термы
              - spa
            category: spa
            status: active
            popularityWeight: 95
            coverImageUrl: /v1/places/place_ekb_001/photo
            counters:
              dzen: 12
              telegram: 7
              instagram: 3
          - id: place_ekb_002
            title: The Pool
            summary: Современный бассейн с дорожками и семейной зоной.
            tags:
              - бассейн
              - family
            category: pools
            status: active
            popularityWeight: 74
            coverImageUrl: null
            counters:
              dzen: 0
              telegram: 2
              instagram: 1
        total: 2
        page: 1
        pageSize: 20

    Material:
      summary: Материал о месте
      value:
        id: material_telegram_001
        placeId: place_ekb_001
        platform: telegram
        type: post
        title: Обзор комплекса и советы по посещению
        publishedAt: '2026-03-20T10:30:00.000Z'
        durationSec: null
        url: https://t.me/amazing_ekb/321
        redirectUrl: /v1/materials/material_telegram_001/go

    MaterialListResponse:
      summary: Список материалов места
      value:
        items:
          - id: material_telegram_001
            placeId: place_ekb_001
            platform: telegram
            type: post
            title: Обзор комплекса и советы по посещению
            publishedAt: '2026-03-20T10:30:00.000Z'
            durationSec: null
            url: https://t.me/amazing_ekb/321
            redirectUrl: /v1/materials/material_telegram_001/go
          - id: material_dzen_002
            placeId: place_ekb_001
            platform: dzen
            type: video
            title: Видеообзор термального комплекса
            publishedAt: '2026-03-22T09:00:00.000Z'
            durationSec: 183
            url: https://dzen.ru/video/watch/abcdef
            redirectUrl: /v1/materials/material_dzen_002/go

    ValidationError:
      summary: Ошибка валидации входных данных
      value:
        statusCode: 400
        message:
          - page must not be less than 1
        error: Bad Request

    UnauthorizedError:
      summary: Пользователь не аутентифицирован
      value:
        statusCode: 401
        message: Authentication required
        error: Unauthorized

    ForbiddenError:
      summary: Недостаточно прав
      value:
        statusCode: 403
        message: Insufficient role
        error: Forbidden

    TooManyRequestsError:
      summary: Слишком много auth-запросов
      value:
        statusCode: 429
        message: Too many auth attempts, please retry later

    PlaceNotFoundError:
      summary: Место не найдено
      value:
        statusCode: 404
        message: Place not found
        error: Not Found

    MaterialNotFoundError:
      summary: Материал не найден
      value:
        statusCode: 404
        message: Material not found
        error: Not Found

    PinnedMaterialBadRequestError:
      summary: Материал не принадлежит месту
      value:
        statusCode: 400
        message: Pinned material must belong to the same place
        error: Bad Request

    ServiceUnavailableError:
      summary: Сервис временно не готов
      value:
        statusCode: 503
        message: Database is not ready
        error: Service Unavailable

    HealthLiveResponse:
      summary: Приложение живо
      value:
        status: ok

    HealthReadyResponse:
      summary: Приложение готово обслуживать запросы
      value:
        status: ok
        checks:
          database: up

  responses:
    ValidationError:
      description: Ошибка валидации входных параметров или тела запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/ValidationError'

    Unauthorized:
      description: Пользователь не аутентифицирован или auth cookie отсутствует/некорректна.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/UnauthorizedError'

    Forbidden:
      description: У текущего пользователя недостаточно прав для выполнения операции.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/ForbiddenError'

    TooManyRequests:
      description: Слишком много auth-запросов за короткий промежуток времени.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/TooManyRequestsError'

    PlaceNotFound:
      description: Указанное место не найдено.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/PlaceNotFoundError'

    MaterialNotFound:
      description: Указанный материал не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/MaterialNotFoundError'

    ServiceUnavailable:
      description: Сервис временно не готов обрабатывать запросы.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestErrorResponse'
          examples:
            default:
              $ref: '#/components/examples/ServiceUnavailableError'

  schemas:
    Role:
      type: string
      description: Роль пользователя в системе.
      enum: [admin, user]
      example: admin

    PlaceCategory:
      type: string
      description: Категория места в каталоге.
      enum: [pools, spa, cafe, hotels, workshops]
      example: spa

    PlaceStatus:
      type: string
      description: Статус публикации места.
      enum: [active, hidden]
      example: active

    Platform:
      type: string
      description: Платформа, на которой опубликован материал.
      enum: [dzen, telegram, instagram]
      example: telegram

    MaterialType:
      type: string
      description: Тип материала.
      enum: [post, reel, video]
      example: post

    NestErrorResponse:
      type: object
      description: Стандартный JSON body, который NestJS возвращает для `HttpException`.
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          description: HTTP status code ответа.
          example: 400
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Сообщение ошибки. Для DTO validation NestJS обычно возвращает массив строк.
          example: Bad Request
        error:
          type: string
          description: Стандартное HTTP reason summary от NestJS.
          example: Bad Request

    AuthLoginRequest:
      type: object
      description: Данные для входа пользователя по email и паролю.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email пользователя.
          example: admin@amazing-ekb.ru
        password:
          type: string
          minLength: 8
          description: Пароль пользователя.
          example: supersecret123

    AuthMeResponse:
      type: object
      description: Публичный профиль текущего пользователя.
      required: [id, email, role]
      properties:
        id:
          type: string
          description: Идентификатор пользователя.
          example: user_admin_001
        email:
          type: string
          format: email
          description: Email пользователя.
          example: admin@amazing-ekb.ru
        role:
          $ref: '#/components/schemas/Role'

    PlaceSummary:
      type: object
      description: Краткая карточка места, используемая в списках.
      required: [id, title, summary, tags, category, status, popularityWeight, coverImageUrl]
      properties:
        id:
          type: string
          description: Идентификатор места.
          example: place_ekb_001
        title:
          type: string
          description: Название места.
          example: Bаден-Баден Уктус
        summary:
          type: string
          description: Короткое описание для каталога.
          example: Термальный комплекс с открытыми бассейнами и SPA-зоной.
        tags:
          type: array
          description: Набор тегов для поиска и фильтрации.
          items:
            type: string
          example:
            - термы
            - spa
            - бассейн
        category:
          $ref: '#/components/schemas/PlaceCategory'
        status:
          $ref: '#/components/schemas/PlaceStatus'
        popularityWeight:
          type: integer
          description: Вес популярности для сортировки.
          example: 95
        coverImageUrl:
          type: string
          nullable: true
          description: Публичный cover-фото места. Если фото отсутствует или не должно отдаться публично, возвращается `null`.
          example: /v1/places/place_ekb_001/photo

    PublicPlaceSummary:
      description: Краткая публичная карточка места со счетчиками материалов по платформам.
      allOf:
        - $ref: '#/components/schemas/PlaceSummary'
        - type: object
          required:
            - counters
          properties:
            counters:
              type: object
              description: Количество материалов по платформам.
              required: [dzen, telegram, instagram]
              properties:
                dzen:
                  type: integer
                  example: 12
                telegram:
                  type: integer
                  example: 7
                instagram:
                  type: integer
                  example: 3

    Material:
      type: object
      description: Материал, связанный с местом.
      required: [id, placeId, platform, type, title, publishedAt, url, durationSec]
      properties:
        id:
          type: string
          description: Идентификатор материала.
          example: material_telegram_001
        placeId:
          type: string
          description: Идентификатор места, к которому относится материал.
          example: place_ekb_001
        platform:
          $ref: '#/components/schemas/Platform'
        type:
          $ref: '#/components/schemas/MaterialType'
        title:
          type: string
          description: Заголовок материала.
          example: Обзор комплекса и советы по посещению
        publishedAt:
          type: string
          format: date-time
          description: Дата и время публикации материала.
          example: '2026-03-20T10:30:00.000Z'
        durationSec:
          type: integer
          nullable: true
          description: Длительность в секундах для видеоформатов.
          example: 183
        url:
          type: string
          format: uri
          description: Публичная ссылка на материал. Допускаются только абсолютные http/https URL.
          example: https://t.me/amazing_ekb/321
        redirectUrl:
          type: string
          nullable: true
          description: Same-origin redirect URL для публичного открытия материала без прямого внешнего href. Поле заполняется только для публично безопасных target URL.
          example: /v1/materials/material_telegram_001/go

    PlaceDetail:
      description: Детальная карточка места с pinned material и счетчиками по платформам.
      allOf:
        - $ref: '#/components/schemas/PublicPlaceSummary'
        - type: object
          required:
            - pinnedMaterial
          properties:
            pinnedMaterial:
              nullable: true
              description: Закреплённый материал места, если он назначен.
              oneOf:
                - $ref: '#/components/schemas/Material'

    PlaceListResponse:
      type: object
      description: Пагинированный список мест.
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          description: Элементы текущей страницы.
          items:
            $ref: '#/components/schemas/PlaceSummary'
        total:
          type: integer
          description: Общее количество доступных элементов.
          example: 2
        page:
          type: integer
          description: Текущая страница.
          example: 1
        pageSize:
          type: integer
          description: Размер страницы.
          example: 20

    PublicPlaceListResponse:
      type: object
      description: Публичный пагинированный список мест со счетчиками материалов.
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          description: Элементы текущей страницы.
          items:
            $ref: '#/components/schemas/PublicPlaceSummary'
        total:
          type: integer
          description: Общее количество доступных элементов.
          example: 2
        page:
          type: integer
          description: Текущая страница.
          example: 1
        pageSize:
          type: integer
          description: Размер страницы.
          example: 20

    MaterialListResponse:
      type: object
      description: Ограниченный список материалов места.
      required: [items]
      properties:
        items:
          type: array
          description: Материалы места в стабильном порядке отображения.
          items:
            $ref: '#/components/schemas/Material'

    CreatePlaceRequest:
      type: object
      description: Payload создания нового места.
      required: [title, category]
      properties:
        title:
          type: string
          description: Название места.
          example: Bаден-Баден Уктус
        summary:
          type: string
          description: Короткое описание места. Если поле не передано, backend сохранит пустую строку.
          example: Термальный комплекс с открытыми бассейнами и SPA-зоной.
        tags:
          type: array
          description: Теги для поиска и фильтрации. Если поле не передано, backend сохранит пустой массив.
          items:
            type: string
          example:
            - термы
            - spa
            - бассейн
        category:
          $ref: '#/components/schemas/PlaceCategory'
        popularityWeight:
          type: integer
          description: Начальный вес популярности. Если поле не передано, backend сохранит 0.
          example: 95

    UpdatePlaceRequest:
      type: object
      description: Payload частичного обновления места.
      properties:
        title:
          type: string
          description: Новое название места.
          example: Bаден-Баден Уктус Premium
        summary:
          type: string
          description: Обновлённое краткое описание.
          example: Обновлённое описание места для карточки.
        tags:
          type: array
          description: Новый набор тегов.
          items:
            type: string
          example:
            - термы
            - premium
        category:
          $ref: '#/components/schemas/PlaceCategory'
        popularityWeight:
          type: integer
          description: Обновлённый вес популярности.
          example: 99

    UpdatePlaceStatusRequest:
      type: object
      description: Payload изменения статуса места.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/PlaceStatus'

    CreateMaterialRequest:
      type: object
      description: Payload создания нового материала для места.
      required: [platform, type, title, publishedAt, url]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        type:
          $ref: '#/components/schemas/MaterialType'
        title:
          type: string
          description: Заголовок материала.
          example: Обзор комплекса и советы по посещению
        publishedAt:
          type: string
          format: date-time
          description: Момент публикации материала.
          example: '2026-03-20T10:30:00.000Z'
        durationSec:
          type: integer
          nullable: true
          description: Длительность в секундах для видеоформатов.
          example: 183
        url:
          type: string
          format: uri
          description: Публичная ссылка на материал. Допускаются только абсолютные http/https URL.
          example: https://t.me/amazing_ekb/321

    UpdateMaterialRequest:
      type: object
      description: Payload частичного обновления материала.
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        type:
          $ref: '#/components/schemas/MaterialType'
        title:
          type: string
          description: Новый заголовок материала.
          example: Обновлённый обзор комплекса
        publishedAt:
          type: string
          format: date-time
          description: Новая дата публикации.
          example: '2026-03-22T09:00:00.000Z'
        durationSec:
          type: integer
          nullable: true
          description: Новая длительность в секундах.
          example: 240
        url:
          type: string
          format: uri
          description: Новая публичная ссылка на материал. Допускаются только абсолютные http/https URL.
          example: https://t.me/amazing_ekb/400

    SetPinnedMaterialRequest:
      type: object
      description: Payload назначения закреплённого материала для места.
      required: [materialId]
      properties:
        materialId:
          type: string
          description: Идентификатор материала, который нужно закрепить.
          example: material_telegram_001

    PlacePhotoUploadRequest:
      type: object
      description: Multipart payload для загрузки cover-фото места.
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
          description: Файл cover-фото в формате JPEG, PNG или WebP размеров до 5 MB.

    HealthLiveResponse:
      type: object
      description: Ответ liveness-пробы. Показывает, что процесс приложения запущен.
      required: [status]
      properties:
        status:
          type: string
          description: Признак живости приложения.
          example: ok

    HealthReadyResponse:
      type: object
      description: Ответ readiness-пробы. Показывает готовность приложения обслуживать запросы.
      required: [status, checks]
      properties:
        status:
          type: string
          description: Общий статус готовности.
          example: ok
        checks:
          type: object
          description: Результаты инфраструктурных проверок.
          required: [database]
          properties:
            database:
              type: string
              description: Статус подключения к базе данных.
              example: up

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Проверяет, что процесс приложения запущен и HTTP-слой отвечает на запросы.
      operationId: getLiveness
      responses:
        '200':
          description: Приложение живо и принимает запросы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLiveResponse'
              examples:
                default:
                  $ref: '#/components/examples/HealthLiveResponse'

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Проверяет готовность приложения обслуживать запросы, включая доступность базы данных.
      operationId: getReadiness
      responses:
        '200':
          description: Приложение готово обслуживать запросы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'
              examples:
                default:
                  $ref: '#/components/examples/HealthReadyResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Аутентифицирует пользователя по email и паролю, ставит access/refresh HttpOnly cookies и возвращает публичный профиль.
      operationId: login
      requestBody:
        required: true
        description: Учетные данные пользователя.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              default:
                $ref: '#/components/examples/AuthLoginRequest'
      responses:
        '200':
          description: Успешная аутентификация. Ответ устанавливает `aeh_access_token` и `aeh_refresh_token`.
          headers:
            Set-Cookie:
              description: HttpOnly auth cookies для access и refresh токенов.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
              examples:
                default:
                  $ref: '#/components/examples/AuthMeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      description: Обновляет access/refresh HttpOnly cookies по валидной refresh cookie.
      operationId: refreshTokens
      security:
        - RefreshCookieAuth: []
      responses:
        '204':
          description: Cookies успешно перевыпущены.
          headers:
            Set-Cookie:
              description: Новые HttpOnly auth cookies для access и refresh токенов.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Выполняет logout, отзывает refresh token из cookie и очищает auth cookies.
      operationId: logout
      security:
        - RefreshCookieAuth: []
      responses:
        '204':
          description: Refresh token отозван, auth cookies очищены.
          headers:
            Set-Cookie:
              description: Очистка `aeh_access_token` и `aeh_refresh_token`.
              schema:
                type: string

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Возвращает публичный профиль текущего аутентифицированного пользователя.
      operationId: getCurrentUser
      security:
        - AccessCookieAuth: []
      responses:
        '200':
          description: Профиль текущего пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
              examples:
                default:
                  $ref: '#/components/examples/AuthMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /places:
    get:
      tags: [Places]
      summary: List places
      description: Возвращает публичный список мест с пагинацией, поиском и фильтрацией по категории.
      operationId: listPlaces
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          required: false
          description: Полнотекстовый поиск по названию и описанию места. Максимум 100 символов.
          schema:
            type: string
            maxLength: 100
          example: термы
        - name: sort
          in: query
          required: false
          description: Режим сортировки списка мест.
          schema:
            type: string
            enum: [popular]
            default: popular
          example: popular
        - name: category
          in: query
          required: false
          description: Фильтр по категории места.
          schema:
            $ref: '#/components/schemas/PlaceCategory'
          example: spa
      responses:
        '200':
          description: Пагинированный список мест.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlaceListResponse'
              examples:
                default:
                  $ref: '#/components/examples/PublicPlaceListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /places/{placeId}:
    get:
      tags: [Places]
      summary: Get place details
      description: Возвращает детальную карточку публичного места по его идентификатору.
      operationId: getPlaceDetail
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Детальная карточка места.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetail'
              examples:
                default:
                  $ref: '#/components/examples/PlaceDetail'
        '404':
          $ref: '#/components/responses/PlaceNotFound'

  /places/{placeId}/photo:
    get:
      tags: [Places]
      summary: Get place cover photo
      description: Возвращает бинарное содержимое публичного cover-фото активного места.
      operationId: getPlaceCoverPhoto
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '200':
          description: Бинарное содержимое публичного cover-фото.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/PlaceNotFound'

  /places/{placeId}/materials:
    get:
      tags: [Places]
      summary: List place materials
      description: Возвращает до 100 материалов, связанных с указанным активным местом, с опциональным фильтром по платформе.
      operationId: listPlaceMaterials
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - name: platform
          in: query
          required: false
          description: Фильтр по платформе публикации материала.
          schema:
            $ref: '#/components/schemas/Platform'
          example: telegram
      responses:
        '200':
          description: Список материалов места.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialListResponse'
              examples:
                default:
                  $ref: '#/components/examples/MaterialListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/PlaceNotFound'

  /materials/{materialId}/go:
    get:
      tags: [Places]
      summary: Redirect to material URL
      description: Выполняет временный redirect на сохраненный URL публичного материала. Endpoint не принимает внешний URL от клиента и работает только для материалов активных мест с безопасной https-ссылкой платформы.
      operationId: redirectMaterial
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      responses:
        '302':
          description: Временный redirect на сохраненный внешний URL материала.
          headers:
            Location:
              description: Безопасный абсолютный https URL материала.
              schema:
                type: string
                format: uri
        '404':
          $ref: '#/components/responses/MaterialNotFound'

  /favorites:
    get:
      tags: [Favorites]
      summary: List favorites
      description: Возвращает список избранных мест текущего аутентифицированного пользователя.
      operationId: listFavorites
      security:
        - AccessCookieAuth: []
      responses:
        '200':
          description: Список избранных мест.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
              examples:
                default:
                  $ref: '#/components/examples/PlaceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favorites/{placeId}:
    post:
      tags: [Favorites]
      summary: Add favorite
      description: Добавляет место в избранное текущего пользователя.
      operationId: addFavorite
      security:
        - AccessCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '204':
          description: Место добавлено в избранное.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlaceNotFound'
    delete:
      tags: [Favorites]
      summary: Remove favorite
      description: Удаляет место из избранного текущего пользователя.
      operationId: removeFavorite
      security:
        - AccessCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '204':
          description: Место удалено из избранного.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/places:
    get:
      tags: [Admin]
      summary: List admin places
      description: Возвращает административный список мест с пагинацией и опциональной фильтрацией по статусу. Если `status` не указан, возвращаются и активные, и скрытые места.
      operationId: listAdminPlaces
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          description: Фильтр по статусу места. Если параметр отсутствует, возвращаются все статусы.
          schema:
            $ref: '#/components/schemas/PlaceStatus'
          example: hidden
      responses:
        '200':
          description: Пагинированный административный список мест.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
              examples:
                default:
                  $ref: '#/components/examples/PlaceListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Create place
      description: Создаёт новое место в каталоге. Операция доступна только администратору.
      operationId: createPlace
      security:
        - AccessCookieAuth: []
      x-required-role: admin
      requestBody:
        required: true
        description: Данные нового места.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaceRequest'
            examples:
              default:
                value:
                  title: Bаден-Баден Уктус
                  summary: Термальный комплекс с открытыми бассейнами и SPA-зоной.
                  tags:
                    - термы
                    - spa
                    - бассейн
                  category: spa
                  popularityWeight: 95
      responses:
        '201':
          description: Место успешно создано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSummary'
              examples:
                default:
                  $ref: '#/components/examples/PlaceSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/places/{placeId}:
    get:
