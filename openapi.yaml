          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
              examples:
                validation:
                  $ref: '#/components/examples/ValidationError'
                badRequest:
                  $ref: '#/components/examples/PinnedMaterialBadRequestError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Место или материал не найдены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestErrorResponse'
              examples:
